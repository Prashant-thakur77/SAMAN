# SAMAN CI — the four gates that must hold on every push (spec §8, §9).
#
# Deliberately installs only `requirements.txt`: the optional accelerators are
# not what SAMAN requires, and one of them (splink) pulls in GPL-2.0 igraph.
# Running the licence check against the required set is the whole point of the
# gate — see THIRD_PARTY_LICENSES.md.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install required dependencies only
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Tests
        working-directory: backend
        # Every reported metric comes from the held-out split; the suite asserts
        # the §8 M3 gate rather than trusting a printed number.
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Type-check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Both requirement files here, unlike the backend job: the inventory has
      # to cover the optional accelerators too, or THIRD_PARTY_LICENSES.md would
      # differ from the committed copy and the GPL finding in splink's tree
      # would go unrecorded. The check is still scoped to the required set.
      - name: Install everything, required and optional
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-optional.txt
          cd frontend && npm ci

      - name: Fail on GPL or AGPL in the required dependency set
        run: python backend/scripts/licenses.py --check

      - name: THIRD_PARTY_LICENSES.md is up to date
        run: |
          python backend/scripts/licenses.py
          git diff --exit-code THIRD_PARTY_LICENSES.md \
            || (echo "::error::THIRD_PARTY_LICENSES.md is stale — run 'make licenses'" && exit 1)
