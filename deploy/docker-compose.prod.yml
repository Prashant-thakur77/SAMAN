# SAMAN, deployed: one API process, one web server, an optional local model.
#
#   cd deploy && cp .env.example .env && edit .env
#   docker compose --env-file .env -f docker-compose.prod.yml up -d --build
#   docker compose --env-file .env -f docker-compose.prod.yml --profile llm up -d --build   # with Ollama
#
# The web service (Caddy) serves the built frontend and proxies /api to the
# backend on the same origin, so no CORS and no cross-site cookies. Give it a
# domain in SAMAN_DOMAIN and it obtains and renews HTTPS certificates itself.
# Nothing here needs the internet at runtime except that certificate.

services:
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
      args:
        # "voice" bakes in local speech and OCR (bigger image, longer build).
        SAMAN_EXTRAS: ${SAMAN_EXTRAS:-none}
    env_file: .env
    environment:
      SAMAN_DB_PATH: /srv/data/app.db
      # Pinned so the engine never depends on what a host happens to have.
      SAMAN_TIER1_ENGINE: rapidfuzz
      # Empty means the rule-based Tier 3. With the llm profile, point at the
      # ollama service; from a laptop, http://host.docker.internal:11434
      # reaches an Ollama already running on the host.
      OLLAMA_URL: ${OLLAMA_URL:-}
      SAMAN_OLLAMA_AUTODETECT: "false"
    volumes:
      - ../data:/srv/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      # ":80" serves plain HTTP on port 80. A hostname such as
      # saman.example.gov.in turns on automatic HTTPS.
      SAMAN_DOMAIN: ${SAMAN_DOMAIN:-:80}
    ports:
      - "${SAMAN_HTTP_PORT:-80}:80"
      - "${SAMAN_HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # The local language model, on the same machine as the API. CPU-only is
  # fine for the 3B model; allow about 4 GB of RAM for it.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    volumes:
      # A named volume by default. On a machine that already runs Ollama, point
      # OLLAMA_MODELS_DIR at its store (/usr/share/ollama/.ollama for the Linux
      # service, ~/.ollama for a user install) with OLLAMA_MODELS_RO=:ro, and
      # nothing is downloaded twice.
      - ${OLLAMA_MODELS_DIR:-ollama}:/root/.ollama${OLLAMA_MODELS_RO:-}
    restart: unless-stopped

  # One-shot: makes sure the model is present, pulling it only when it is not.
  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["llm"]
    depends_on:
      - ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint:
      - /bin/sh
      - -c
      - >-
        sleep 4;
        ollama list | grep -q "^${OLLAMA_MODEL:-qwen2.5:3b}" && echo "model present"
        || ollama pull ${OLLAMA_MODEL:-qwen2.5:3b}
    restart: "no"

  # Laptop path: reach an Ollama already running on the host, GPU and all,
  # even though it listens on 127.0.0.1 only. Binds on the Docker bridge
  # address, so the forwarded port is never on the LAN. With this profile set
  # OLLAMA_URL=http://host.docker.internal:11435.
  host-ollama-bridge:
    image: python:3.12-slim
    profiles: ["host-llm"]
    network_mode: host
    volumes:
      - ./tcp-bridge.py:/bridge.py:ro
    command: ["python", "/bridge.py", "${DOCKER_BRIDGE_IP:-172.17.0.1}", "11435", "127.0.0.1", "11434"]
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  ollama:
